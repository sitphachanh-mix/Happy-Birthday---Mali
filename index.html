    <style>

<body>

    <h1>🎉 ສຸກສັນວັນເກີດ ມະລິ ຄົນເກັ່ງ ^^! 🎂</h1>
    <p>ຂໍໃຫ້ມີນ້ອງມີຄວາມສຸກຫຼາຍໆ, ມີສຸຂະພາບແຂງແຮງ, ປາດຖະໜາສິ່ງໃດກໍຂໍໃຫ້ສົມຫວັງທຸກສິ່ງຢ່າງເດີ້ ແລະ ສິ່ງສຳຄັນປີນີ້ຂໍໃຫ້ນ້ອງສົມຫວັງກັບການສອບເສັງນັກຮຽນເກັ່ງ ແລະ ການສອບເສັງຕ່າງໆທີ່ຕັ້ງໃຈໃຫ້ປະສົບຜົນສຳເລັດເນີ້ ^^!</p>
